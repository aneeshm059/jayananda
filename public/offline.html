<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#71382f" />
    <meta name="robots" content="noindex, nofollow" />
    <title>You're offline · Jayananda</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        background: #f5f0e8;
        color: #302923;
        font:
          16px/1.65 system-ui,
          sans-serif;
      }
      main {
        max-width: 420px;
        text-align: center;
      }
      .brand {
        color: #71382f;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.18em;
      }
      h1 {
        font:
          36px/1.2 Georgia,
          serif;
        margin: 22px 0 16px;
      }
      p {
        color: #6b5f52;
      }
      a {
        display: inline-block;
        margin-top: 14px;
        min-height: 48px;
        padding: 12px 24px;
        background: #71382f;
        color: #fffdf9;
        border-radius: 9px;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #80602d;
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">JAYANANDA</div>
      <h1>A quiet pause.</h1>
      <p>
        You're offline. Connect to the internet to open your journal and save your daily practice.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
